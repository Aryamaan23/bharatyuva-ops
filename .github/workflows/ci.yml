name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx next typegen && npm run typecheck

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Write .env.local from the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          sed -e "s|^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY|" \
              -e "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY|" \
              -e "s|^CRON_SECRET=.*|CRON_SECRET=$(openssl rand -hex 32)|" \
              -e "s|^HASH_SALT=.*|HASH_SALT=$(openssl rand -hex 32)|" \
              -e "s|^TOKEN_SIGNING_SECRET=.*|TOKEN_SIGNING_SECRET=$(openssl rand -hex 32)|" \
              .env.example > .env.local
          cp .env.local .env

      - name: Migrations apply cleanly
        run: npm run db:migrate

      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate --name=drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/server/db/schema changed without a migration. Run npm run db:generate and commit it."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Seed fake data
        run: npm run db:seed

      - name: Unit and database tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (builds the app)
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
